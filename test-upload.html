<!DOCTYPE html>
<html>

<head>
    <title>Upload Test</title>
</head>

<body>
    <h1>PDF Upload Test</h1>
    <input type="file" id="fileInput" accept=".pdf">
    <button onclick="testUpload()">Test Upload</button>
    <div id="result"></div>

    <script>
        async function testUpload() {
            const fileInput = document.getElementById('fileInput');
            const resultDiv = document.getElementById('result');

            if (!fileInput.files[0]) {
                resultDiv.innerHTML = '<p style="color: red;">Please select a file first</p>';
                return;
            }

            const formData = new FormData();
            formData.append('file', fileInput.files[0]);

            try {
                resultDiv.innerHTML = '<p>Uploading...</p>';
                console.log('Uploading to: http://localhost:8000/api/v1/research/upload');

                const response = await fetch('http://localhost:8000/api/v1/research/upload', {
                    method: 'POST',
                    body: formData,
                    mode: 'cors'
                });

                console.log('Response status:', response.status);
                const data = await response.json();
                console.log('Response data:', data);

                if (response.ok) {
                    resultDiv.innerHTML = `<p style="color: green;">✅ Success! Paper ID: ${data.paper_id}, Title: ${data.title}</p>`;
                } else {
                    resultDiv.innerHTML = `<p style="color: red;">❌ Failed: ${JSON.stringify(data)}</p>`;
                }
            } catch (error) {
                console.error('Error:', error);
                resultDiv.innerHTML = `<p style="color: red;">❌ Error: ${error.message}</p>`;
            }
        }
    </script>
</body>

</html>
